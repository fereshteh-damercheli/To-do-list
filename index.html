<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="fontawesome-free-7.3.1-web/css/all.css">
    <script src="node_modules/jquery/dist/jquery.min.js" defer></script>
    <script src="js/events.js" defer></script>
    <title>To-Do-list</title>

</head>
<body>
<section class="to-do">
    <section class="topic">
        <h1><i class="fa-solid fa-square-check"></i>Task Flow</h1>

    </section>
    <section class="addTask">
        <section class="taskTitle">
            <label for="task-title">Task title</label>
            <input type="text" name="task-title" id="task-title" placeholder="What needs to do?">
            <span class="error">Please enter a task title</span>
        </section>
        <section class="priority">
            <label for="priority">Priority</label>
            <select name="priority" id="priority">
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
        </section>
        <button>Add Task</button>
    </section>
    <section class="progress">
        <div class="text">
            <span>Progress</span>
            <span class="progressText">0 of 0 done(0%)</span>
        </div>
        <div class="container">
            <div class="progress-bar"></div>
        </div>

    </section>
    <section class="filter"></section>
    <section class="showTasks"></section>
    <section class="help"></section>
</section>


</body>
</html>
